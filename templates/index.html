<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Équation Grapher</title>
</head>
<body>
    <h1>Visualisation de l'Équation</h1>
    <form method="post">
        {% csrf_token %}
        <label for="equation">Entrez une équation (en fonction de x): </label>
        <input type="text" id="equation" name="equation" placeholder="x**2" required>
        <button type="submit">Tracer</button>
    </form>

    {% if plot %}
    <img src="{{ plot }}" alt="Graphique de l'équation">
    {% endif %}
</body>
</html>
