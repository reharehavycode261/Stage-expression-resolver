<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisation d'Équations</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        input, button { padding: 0.5em; margin: 0.5em 0; }
        canvas { margin-top: 1em; }
    </style>
</head>
<body>
    <h1>Visualisation Interactive des Équations</h1>
    <form id="equationForm">
        <label for="equationInput">Écrivez votre équation (en fonction de 'x'):</label>
        <input type="text" id="equationInput" placeholder="Exemple: 2*sin(x) + x" required>
        <button type="submit">Visualiser l'Équation</button>
    </form>
    <div id="plotContainer"></div>

    <script>
        document.getElementById('equationForm').onsubmit = async function (e) {
            e.preventDefault();
            const equation = document.getElementById('equationInput').value;
            const response = await fetch('/visualize-equation/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ equation: equation })
            });
            const plotUrl = await response.text();
            document.getElementById('plotContainer').innerHTML = `<img src="${plotUrl}" alt="Equation Plot" />`;
        };
    </script>
</body>
</html>
